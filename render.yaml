databases:
  - name: stageconnect-db
    plan: free
    databaseName: stageconnect
    user: stageconnect

services:
  - type: web
    plan: free
    name: stageconnect
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "python -m gunicorn stageconnect.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: stageconnect-db
          property: connectionString

      - key: SECRET_KEY
        generateValue: true

      - key: DEBUG
        value: "False"

      - key: WEB_CONCURRENCY
        value: "4"